<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jarvis Dashboard</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #12151c;
    --border: #232838;
    --text: #e6e9f0;
    --muted: #8a91a3;
    --accent: #4da3ff;
    --idle: #6b7280;
    --listening: #22c55e;
    --thinking: #eab308;
    --speaking: #4da3ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 20% 0%, #161b26 0%, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 40px 24px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 4px;
    letter-spacing: 0.2px;
  }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 28px; }

  .status-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px 24px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .dot {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--idle);
    box-shadow: 0 0 0 0 rgba(0,0,0,0);
    transition: background 0.3s ease;
  }
  .dot.pulse {
    animation: pulse 1.4s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 currentColor; opacity: 1; }
    70% { box-shadow: 0 0 0 10px transparent; opacity: 0.6; }
    100% { box-shadow: 0 0 0 0 transparent; opacity: 1; }
  }
  .status-text { font-size: 17px; font-weight: 600; text-transform: capitalize; }
  .status-time { color: var(--muted); font-size: 12px; margin-left: auto; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 24px;
    margin-bottom: 20px;
  }
  .card h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0 0 12px;
    font-weight: 600;
  }
  .line { font-size: 15px; line-height: 1.5; margin-bottom: 8px; }
  .line .label { color: var(--muted); margin-right: 6px; }
  .empty { color: var(--muted); font-style: italic; font-size: 14px; }

  ul.memory { list-style: none; margin: 0; padding: 0; }
  ul.memory li {
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  ul.memory li:last-child { border-bottom: none; }

  .offline {
    text-align: center;
    color: var(--muted);
    padding: 60px 0;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Jarvis</h1>
    <div class="sub">Local status dashboard — auto-refreshes every second</div>

    <div class="status-card">
      <div class="dot" id="dot"></div>
      <div class="status-text" id="statusText">Offline</div>
      <div class="status-time" id="statusTime"></div>
    </div>

    <div class="card">
      <h2>Last heard</h2>
      <div class="line" id="lastHeard"><span class="empty">Nothing yet</span></div>
    </div>

    <div class="card">
      <h2>Last reply</h2>
      <div class="line" id="lastReply"><span class="empty">Nothing yet</span></div>
    </div>

    <div class="card">
      <h2>Remembered facts</h2>
      <ul class="memory" id="memoryList"></ul>
    </div>
  </div>

<script>
const colors = { idle: "var(--idle)", listening: "var(--listening)", thinking: "var(--thinking)", speaking: "var(--speaking)" };

async function refresh() {
  try {
    const res = await fetch("status.json?_=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("no status file yet");
    const data = await res.json();

    const dot = document.getElementById("dot");
    const statusText = document.getElementById("statusText");
    const statusTime = document.getElementById("statusTime");

    dot.style.background = colors[data.state] || colors.idle;
    dot.style.color = colors[data.state] || colors.idle;
    dot.classList.toggle("pulse", data.state === "listening" || data.state === "thinking");
    statusText.textContent = data.state || "idle";
    statusTime.textContent = data.updated_at ? ("Updated " + data.updated_at) : "";

    const heardEl = document.getElementById("lastHeard");
    heardEl.innerHTML = data.last_heard ? escapeHtml(data.last_heard) : '<span class="empty">Nothing yet</span>';

    const replyEl = document.getElementById("lastReply");
    replyEl.innerHTML = data.last_reply ? escapeHtml(data.last_reply) : '<span class="empty">Nothing yet</span>';

    const memList = document.getElementById("memoryList");
    memList.innerHTML = "";
    if (data.memory && data.memory.length) {
      data.memory.forEach(fact => {
        const li = document.createElement("li");
        li.textContent = fact;
        memList.appendChild(li);
      });
    } else {
      memList.innerHTML = '<li class="empty">No memories saved yet</li>';
    }
  } catch (e) {
    document.getElementById("statusText").textContent = "Waiting for Jarvis...";
    document.getElementById("dot").style.background = "var(--idle)";
  }
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
